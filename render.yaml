# Render Blueprint: the marketplace API + its Postgres database.
# In the Render dashboard: New → Blueprint → pick this repo.
# Render redeploys the API on every push to main.
services:
  - type: web
    name: marketplace-api
    runtime: docker
    plan: starter            # $7/mo, 512 MB RAM
    region: virginia         # change to match your other Render services
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: prod
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString

databases:
  - name: marketplace-db
    databaseName: marketplace
    user: marketplace
    plan: basic-256mb        # $6/mo + storage
    region: virginia         # must match the API's region
    postgresMajorVersion: "16"
    ipAllowList: []          # no public access; only Render services can connect
