# Local development and test server: Postgres + the API.
#   docker compose up --build
# API on http://localhost:8080, Postgres on localhost:5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      ADDR: ":8080"
      DATABASE_URL: postgres://marketplace:marketplace@db:5432/marketplace?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  pgdata:
